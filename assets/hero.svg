<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Karn — Developer, Solutions Architect, and Data Engineer</title>
  <desc id="desc">Animated architecture console header showing Ayush's role and current focus.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1827"/>
      <stop offset="1" stop-color="#09131d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21d4a7" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b78cff" stop-opacity=".65"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { fill: #708399; font-size: 12px; letter-spacing: 1.7px; }
      .muted { fill: #9fb0c3; font-size: 15px; }
      .name { fill: #eaf2fb; font-size: 37px; font-weight: 700; letter-spacing: .3px; }
      .role { fill: #b9c8d8; font-size: 17px; }
      .accent { fill: #55e6bd; }
      .flow { stroke-dasharray: 6 11; animation: flow 7s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .caret { animation: blink 1.05s step-end infinite; }
      @keyframes flow { to { stroke-dashoffset: -68; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .caret { animation: none; } }
    </style>
  </defs>

  <rect width="960" height="300" rx="18" fill="url(#panel)"/>
  <rect x=".75" y=".75" width="958.5" height="298.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M0 52H960" stroke="#243548"/>
  <circle cx="25" cy="26" r="5" fill="#ff6b6b"/>
  <circle cx="43" cy="26" r="5" fill="#f4c95d"/>
  <circle cx="61" cy="26" r="5" fill="#55e6bd"/>
  <text x="86" y="31" class="mono label">ARCHITECTURE CONSOLE / PROFILE</text>
  <circle cx="858" cy="26" r="4" fill="#55e6bd" filter="url(#glow)" class="pulse"/>
  <text x="871" y="31" class="mono label" fill="#55e6bd">AVAILABLE</text>

  <g transform="translate(40 82)">
    <text x="0" y="0" class="mono label">IDENTITY</text>
    <text id="profile-name" data-field="name" x="0" y="47" class="mono name">Ayush Karn</text>
    <text id="profile-headline" data-field="headline" x="1" y="80" class="mono role">Developer · Solutions Architect · Data Engineer</text>
    <text x="1" y="125" class="mono muted"><tspan class="accent">$</tspan><tspan> design --connect --automate --scale</tspan><tspan class="caret accent">_</tspan></text>
  </g>

  <g transform="translate(575 78)">
    <text x="0" y="0" class="mono label">SYSTEM FLOW</text>
    <path d="M20 48H310M20 98H310M20 148H310" stroke="#2b4055" stroke-width="2"/>
    <path d="M20 48H310M20 98H310M20 148H310" stroke="url(#edge)" stroke-width="2" class="flow" opacity=".9"/>
    <g class="mono" font-size="11" text-anchor="middle">
      <g transform="translate(20 48)"><circle r="15" fill="#102b31" stroke="#55e6bd"/><text y="4" fill="#55e6bd">REQ</text></g>
      <g transform="translate(116 48)"><circle r="15" fill="#13243a" stroke="#58a6ff"/><text y="4" fill="#8bc3ff">ARC</text></g>
      <g transform="translate(213 48)"><circle r="15" fill="#1c203a" stroke="#9d8cff"/><text y="4" fill="#c6baff">CODE</text></g>
      <g transform="translate(310 48)"><circle r="15" fill="#102b31" stroke="#55e6bd"/><text y="4" fill="#55e6bd">SHIP</text></g>
    </g>
    <text x="0" y="92" class="mono label">CURRENT FOCUS</text>
    <rect x="0" y="111" width="335" height="43" rx="7" fill="#0d2130" stroke="#263e50"/>
    <text id="profile-focus" data-field="focus" x="14" y="137" class="mono muted" font-size="13">Local-first AI and useful developer tools</text>
  </g>

  <text x="40" y="277" class="mono label">BUILD → CONNECT → AUTOMATE → SCALE</text>
  <text x="920" y="277" class="mono label" text-anchor="end">STATUS: <tspan id="profile-status" data-field="status" fill="#55e6bd">OPEN TO GOOD PROBLEMS</tspan></text>
</svg>
