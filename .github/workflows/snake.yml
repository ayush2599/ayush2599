name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "31 2 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2355e6bd&color_dots=%23ebedf0,%23b7eadc,%2368d9b8,%2321b88f,%230b745b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2355e6bd

      - name: Publish SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: "chore: refresh contribution snake"
